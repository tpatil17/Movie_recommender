name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy==1.26.4
          pip install Cython
          pip install git+https://github.com/NicolasHug/Surprise.git
          pip install -r services/backend/requirements.txt

      # Pure-function tests for the offline evaluation metrics. No CSVs, no
      # models, no backend import, so these run in milliseconds and fail fast
      # if the scoring math regresses. Kept before the backend suite because
      # a broken metric silently invalidates every number we report.
      - name: Run offline eval metric tests
        run: pytest eval_offline/test_eval_offline.py -v

      - name: Run backend tests
        env:
          CI: true
        run: |
          PYTHONPATH=services/backend pytest services/backend/tests/ -v