version: '3.8'

services:
  backend:
    build: ./services/backend
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data

  mcp-server:
    build: ./services/mcp-server
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend