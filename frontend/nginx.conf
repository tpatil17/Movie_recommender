server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Takes over the job the Vite dev proxy does locally: the built bundle calls
    # /api/... relative, and nginx forwards that to the backend over the compose
    # network. Without this the browser would request /api from nginx itself.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Model training and cold cosine passes can be slow on first request.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths serve index.html rather than 404, so the
    # tab state survives a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
